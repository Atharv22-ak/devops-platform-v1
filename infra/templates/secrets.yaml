{{- /*
Secrets are generated once on first install and read back on every
`helm upgrade`, so passwords/tokens stay stable.
*/}}
{{- $jwt := lookup "v1" "Secret" .Release.Namespace "jwt-secret" }}
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  labels:
    {{- include "platform.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret: {{ if $jwt }}{{ index $jwt.data "jwt-secret" }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
{{- if .Values.monitoring.enabled }}
---
{{- $grafana := lookup "v1" "Secret" .Release.Namespace (printf "%s-grafana-admin" .Release.Name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-grafana-admin
  labels:
    {{- include "platform.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ if $grafana }}{{ index $grafana.data "admin-password" }}{{ else }}{{ randAlphaNum 16 | b64enc }}{{ end }}
{{- end }}
