{{- if .Values.elk.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "platform.elasticsearch" . }}
  labels:
    app.kubernetes.io/name: elk
    app.kubernetes.io/component: elasticsearch
    {{- include "platform.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "platform.elasticsearch" . }}
  replicas: {{ .Values.elk.elasticsearch.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: elk
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: elasticsearch
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: elk
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: elasticsearch
    spec:
      # Elasticsearch refuses to start if the node's vm.max_map_count is too
      # low. This init container raises it before the main container starts
      # (needs a node that allows privileged init containers).
      initContainers:
        - name: sysctl
          image: busybox:1.36
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144"]
          securityContext:
            privileged: true
      securityContext:
        fsGroup: 1000
      containers:
        - name: elasticsearch
          image: "docker.elastic.co/elasticsearch/elasticsearch:{{ .Values.elk.version }}"
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300
          # Setting names contain dots (discovery.type), which envFrom would
          # skip, so each one is mapped explicitly from the ConfigMap.
          env:
            {{- range $key, $_ := .Values.elk.elasticsearch.env }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef:
                  name: {{ $.Release.Name }}-elasticsearch-config
                  key: {{ $key }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /_cluster/health?local=true
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.elk.elasticsearch.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /usr/share/elasticsearch/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.elk.elasticsearch.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform.elasticsearch" . }}
  labels:
    app.kubernetes.io/name: elk
    app.kubernetes.io/component: elasticsearch
    {{- include "platform.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.elk.elasticsearch.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: elk
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: elasticsearch
{{- end }}
