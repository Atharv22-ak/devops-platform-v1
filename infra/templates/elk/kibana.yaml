{{- if .Values.elk.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.kibana" . }}
  labels:
    app.kubernetes.io/name: elk
    app.kubernetes.io/component: kibana
    {{- include "platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.elk.kibana.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: elk
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: kibana
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: elk
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: kibana
    spec:
      containers:
        - name: kibana
          image: "docker.elastic.co/kibana/kibana:{{ .Values.elk.version }}"
          ports:
            - name: http
              containerPort: 5601
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-kibana-config
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.elk.kibana.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform.kibana" . }}
  labels:
    app.kubernetes.io/name: elk
    app.kubernetes.io/component: kibana
    {{- include "platform.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.elk.kibana.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: elk
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: kibana
{{- end }}
